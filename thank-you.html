<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% include head-assets.html %}
    <title>Thank You | Sriparna Infotech</title>
    <meta name="robots" content="noindex, nofollow">

    <script>
      // Fire the lead conversion only for a real form submission. site.js sets
      // this flag right before redirecting here; reloads, back-button visits
      // and direct hits to /thank-you no longer inflate GA4 conversions.
      try {
        if (sessionStorage.getItem('si_lead_sent') === '1') {
          sessionStorage.removeItem('si_lead_sent');
          gtag('event', 'generate_lead', {'event_category': 'Form', 'event_label': 'Lead Form Submitted', 'value': 1});
        }
      } catch (e) {}
    </script>
</head>
<body>

{% include ambient.html %}

{% include site-nav.html %}

<main id="main-content">
    <section class="thanks-wrap">
        <div class="glass thanks-card">
            <i class="fa-solid fa-circle-check thanks-icon" aria-hidden="true"></i>
            <h1>Thank You!</h1>
            <p>Your service request has been successfully sent. Our team will contact you shortly.</p>
            <a href="/" class="btn btn-primary"><i class="fa-solid fa-house" aria-hidden="true"></i> Back to Home</a>
        </div>
    </section>
</main>

{% include site-footer.html %}

<script src="/assets/js/reviews-config.js" defer></script>
<script src="/assets/js/site.js" defer></script>
</body>
</html>
