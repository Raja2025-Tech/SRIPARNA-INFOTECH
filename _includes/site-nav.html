<!-- Shared site navigation.

     The homepage's section anchors (#services, #faq, ...) only exist on the
     homepage itself. On the homepage we emit bare hash links so clicks scroll
     smoothly in place; on every other page we prefix them with "/" so they
     navigate home and then jump to the section.

     Logo: responsive 3-tier lockup, identical on every page. Desktop/tablet
     show the full wide logotype (sriparna_infotech_logo.webp, 1000x300);
     below 768px it's swapped for the icon mark (favicon.webp, 360x360) next
     to a text wordmark, via CSS media queries only (.nav-logo-full /
     .nav-logo-compact in theme.css) -- no JS swap, so the browser reserves
     the right box before either image decodes and there is no layout shift
     either way. Both <img> tags carry real intrinsic width/height and use
     absolute paths (leading "/") so they resolve from any page, not just "/".
     No wrapper element around the logo images beyond .nav-logo itself -- a
     prior hand-edit added one ("premium-glass-logo") and in a later edit of
     the same session accidentally deleted .nav-menu's display:flex rule
     alongside it, which broke the desktop nav into a vertical stack. Keep
     this bare. -->
{% if page.url == "/" %}{% assign home_prefix = "" %}{% else %}{% assign home_prefix = "/" %}{% endif %}

<header id="nav">
    <div class="nav-inner">
        <a href="{% if page.url == '/' %}#{% else %}/{% endif %}" class="nav-logo" aria-label="Sriparna Infotech — Home">
            <img src="/sriparna_infotech_logo.webp" alt="Sriparna Infotech" width="1000" height="300" class="nav-logo-full" loading="eager" fetchpriority="high" decoding="async">
            <span class="nav-logo-compact">
                <img src="/favicon.webp" alt="" width="360" height="360" loading="eager" fetchpriority="high" decoding="async">
                <span class="nav-logo-word">Sriparna <b>Infotech</b></span>
            </span>
        </a>

        <nav aria-label="Main navigation">
            <ul class="nav-menu" id="navMenu">
                <li><a href="{{ home_prefix }}#services">Services</a></li>
                <li><a href="{{ home_prefix }}#why-us">Why Us</a></li>
                <li><a href="{{ home_prefix }}#faq">FAQ</a></li>
                <li><a href="{{ home_prefix }}#contact">Contact</a></li>
                <li>
                    <a href="tel:+917003872122" class="nav-cta"
                       onclick="gtag('event','generate_lead',{'event_category':'Contact','event_label':'Nav Call','value':1});">
                        <i class="fa-solid fa-phone" aria-hidden="true"></i> +91 70038 72122
                    </a>
                </li>
            </ul>
        </nav>

        <button class="nav-hamburger" id="hamburger" aria-label="Toggle navigation" aria-expanded="false" aria-controls="navMenu">
            <span class="ham-bars"><span class="ham-bar"></span><span class="ham-bar"></span><span class="ham-bar"></span></span>
        </button>
    </div>
</header>
