<!-- Google tag (gtag.js) -->
<!--
  Single source of truth for GA4. Include once, inside <head>, on every public
  page. Do not paste the snippet inline as well: a second gtag() definition
  resets window.dataLayer's push target and double-counts pageviews.

  Every public page now carries front matter, so this tag expands everywhere.
  A page without front matter would be copied verbatim by Jekyll and silently
  lose analytics — check that first if a page stops reporting.
-->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-LKGQF83WF9"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-LKGQF83WF9');</script>
