<!-- Homepage hero art: the 3D technician character waving "Hello!", inside
     a glowing ring with floating devices (styles: "HERO ART" in theme.css).

     The character comes from the owner's own rendered clip, cut out from its
     background and looped. Three files in assets/img/:
       technician-poster.webp  still first frame (28 KB), what the HTML loads
       technician-wave.webm    transparent VP9 loop (~180 KB) for Chrome/Firefox/Edge
       technician-wave.webp    animated WebP loop (~440 KB) for Safari / iOS, which
                               cannot show transparency in WebM
     site.js swaps the still for the right animation after the page has
     loaded, and never under prefers-reduced-motion or Save-Data. The img
     has intrinsic width/height and the box a fixed aspect ratio: no CLS.
     The ring, bubble and floating devices are independent CSS siblings. -->
<div class="hero-art" role="img" aria-label="Illustration of a Sriparna Infotech technician holding a laptop, waving and saying hello">
    <div class="art-glow" aria-hidden="true"></div>
    <div class="art-ring" aria-hidden="true"></div>
    <span class="art-dot d-a" aria-hidden="true"></span>
    <span class="art-dot d-b" aria-hidden="true"></span>
    <span class="art-dot d-c" aria-hidden="true"></span>

    <!-- floating laptop -->
    <svg class="art-float f-laptop" viewBox="0 0 96 76" width="96" height="76" aria-hidden="true" focusable="false">
        <path class="dv-shell" d="M14 6 h68 a6 6 0 0 1 6 6 v40 H8 V12 a6 6 0 0 1 6 -6 Z"/>
        <rect class="dv-screen" x="14" y="12" width="68" height="36" rx="3"/>
        <path class="dv-shine" d="M14 15 a3 3 0 0 1 3 -3 h30 L28 48 H14 Z"/>
        <path class="dv-base" d="M2 54 h92 l-5 10 a6 6 0 0 1 -5 3 H12 a6 6 0 0 1 -5 -3 Z"/>
        <rect class="dv-shine-solid" x="38" y="57" width="20" height="3" rx="1.5"/>
    </svg>

    <!-- floating CCTV camera -->
    <svg class="art-float f-cctv" viewBox="0 0 110 60" width="110" height="60" aria-hidden="true" focusable="false">
        <rect class="dv-mount" x="80" y="25" width="20" height="10" rx="3"/>
        <rect class="dv-mount" x="96" y="8" width="9" height="44" rx="4"/>
        <rect class="dv-white" x="8" y="12" width="78" height="36" rx="16"/>
        <path class="dv-white-shade" d="M24 48 h46 a16 16 0 0 0 16 -16 v-4 a16 16 0 0 1 -16 12 H24 a16 16 0 0 1 -16 -12 v4 a16 16 0 0 0 16 16 Z"/>
        <circle class="dv-lens-ring" cx="26" cy="30" r="15"/>
        <circle class="dv-lens" cx="26" cy="30" r="10"/>
        <circle class="dv-lens-glint" cx="22" cy="26" r="3"/>
        <circle class="dv-led" cx="60" cy="22" r="3"/>
    </svg>

    <!-- floating PC tower with RGB fans -->
    <svg class="art-float f-tower" viewBox="0 0 70 104" width="70" height="104" aria-hidden="true" focusable="false">
        <rect class="dv-tower" x="4" y="4" width="62" height="96" rx="8"/>
        <rect class="dv-tower-glass" x="10" y="10" width="50" height="84" rx="5"/>
        <g class="dv-fans">
            <circle class="fan f1" cx="35" cy="27" r="11"/>
            <circle class="fan f2" cx="35" cy="52" r="11"/>
            <circle class="fan f3" cx="35" cy="77" r="11"/>
        </g>
        <circle class="dv-hub" cx="35" cy="27" r="3.5"/>
        <circle class="dv-hub" cx="35" cy="52" r="3.5"/>
        <circle class="dv-hub" cx="35" cy="77" r="3.5"/>
    </svg>

    <span class="art-bubble" aria-hidden="true">Hello!</span>

    <img class="tech-media" src="/assets/img/technician-poster.webp" width="466" height="600" alt=""
         decoding="async"
         data-webm="/assets/img/technician-wave.webm"
         data-anim="/assets/img/technician-wave.webp">
</div>
