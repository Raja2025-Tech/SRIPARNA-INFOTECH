<!-- Shared <head> assets for every page: JS flag, icons, PWA manifest, the
     sitewide social-meta extras, font preloads, design system, icon subset
     and GA4. Fonts and icons are self-hosted: no Google Fonts / Font Awesome
     CDN requests.
     Page-specific tags (title, description, canonical, robots, og:url/title/
     description, JSON-LD) stay in each page. All paths are root-absolute so
     they resolve from nested URLs too (e.g. the 404 page served at /a/b). -->
<script>document.documentElement.classList.add('js');</script>
<meta name="theme-color" content="#F7FAFF">
<meta name="format-detection" content="telephone=yes">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/webp" href="/favicon.webp">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">

<meta property="og:site_name" content="Sriparna Infotech">
<meta property="og:locale" content="en_IN">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Sriparna Infotech — computer, laptop and CCTV service in Barasat">

<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/inter-latin-var.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/plus-jakarta-sans-latin-var.woff2" crossorigin>
<link rel="preload" as="image" type="image/webp" href="/assets/img/logo-full.webp" imagesrcset="/assets/img/logo-full-360.webp 360w, /assets/img/logo-full.webp 720w" imagesizes="(max-width: 480px) 160px, 250px">
<link rel="preconnect" href="https://www.googletagmanager.com">

<link rel="stylesheet" href="/assets/css/theme.css?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
<link rel="stylesheet" href="/assets/css/icons.css?v={{ site.time | date: '%Y%m%d%H%M%S' }}" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="/assets/css/icons.css"></noscript>
{% include analytics.html %}
