# _config.yml

# Generates redirect stubs for the old /*-repair URLs, which stayed indexed
# after those pages were renamed to /*-service. Whitelisted on GitHub Pages,
# so no Gemfile is needed. Target URLs live in each page's `redirect_from`.
plugins:
  - jekyll-redirect-from

defaults:
  - scope:
      path: ""
      type: "images"
    values:
      cache_control: "max-age=31536000"
  - scope:
      path: ""
      type: "assets"
    values:
      cache_control: "max-age=31536000"
