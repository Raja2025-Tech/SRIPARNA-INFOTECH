name: Internal Link Check

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
  pull_request:
    branches: [main]
    paths:
      - "**/*.html"
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node .github/scripts/check-internal-links.js
